spring.application.name=Usuarios
server.port=8500

# MySQL (XAMPP por defecto). Se puede sobreescribir con variables de entorno.
spring.datasource.url=jdbc:mysql://localhost:3306/usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT: el secreto DEBE ser identico al del microservicio de productos
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Duracion del token en milisegundos (24 horas)
jwt.expiration-ms=86400000

# Administrador inicial (se crea solo si no existe ningun ADMIN). Cambia la clave en produccion.
admin.email=${ADMIN_EMAIL:admin@sonidovivo.cl}
admin.password=${ADMIN_PASSWORD:Admin12345}
